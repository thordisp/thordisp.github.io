<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Backend Software Engineer with expertise in Java, Kotlin, cloud infrastructure, and microservices architecture." />
    <meta property="og:title" content="Þórdís Pétursdóttir — CV" />
    <meta property="og:description" content="Backend Software Engineer with expertise in Java, Kotlin, cloud infrastructure, and microservices architecture." />
    <meta property="og:image" content="./img/CV_image.png" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://thordisp.github.io/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Þórdís Pétursdóttir — CV</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- Hero -->
    <header class="hero" id="top">
      <div class="controls">
        <button class="btn-icon" id="darkModeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="btn-lang" id="langToggle" data-i18n="nav.switchLang">IS</button>
        <button class="btn-pdf" id="downloadPdf" aria-label="Download PDF" title="Download PDF">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>
      <div class="hero__inner">
        <img class="hero__photo" src="./img/CV_image.png" alt="Þórdís Pétursdóttir" />
        <div class="hero__text">
          <h1 class="hero__name" data-i18n="hero.name">Þórdís Pétursdóttir</h1>
          <p class="hero__title" data-i18n="hero.title">Backend Software Engineer</p>
          <div class="hero__links">
            <a class="hero__link" href="https://github.com/thordisp" target="_blank" rel="noopener">GitHub</a>
            <a class="hero__link" href="https://www.linkedin.com/in/thordis-petursdottir/" target="_blank" rel="noopener">LinkedIn</a>
            <a class="hero__link" href="mailto:thordis@hey.com">thordis@hey.com</a>
          </div>
        </div>
      </div>
    </header>

    <main>

      <!-- About -->
      <section class="section animatable" id="about">
        <div class="section__inner">
          <h2 class="section__heading" data-i18n="about.heading">About Me</h2>
          <div class="section__body" data-i18n="about.body"></div>
        </div>
      </section>

      <!-- Experience -->
      <section class="section section--alt animatable" id="experience">
        <div class="section__inner">
          <h2 class="section__heading" data-i18n="experience.heading">Experience</h2>
          <div class="timeline" id="experience-list" aria-label="Work experience"></div>
        </div>
      </section>

      <!-- Education -->
      <section class="section animatable" id="education">
        <div class="section__inner">
          <h2 class="section__heading" data-i18n="education.heading">Education</h2>
          <div class="timeline" id="education-list" aria-label="Education history"></div>
        </div>
      </section>

      <!-- Skills -->
      <section class="section section--alt animatable" id="skills">
        <div class="section__inner">
          <h2 class="section__heading" data-i18n="skills.heading">Skills</h2>
          <div class="skills-grid" id="skills-list"></div>
          <h3 class="subsection__heading" data-i18n="spoken_languages.heading">Languages</h3>
          <div class="lang-grid" id="languages-list"></div>
        </div>
      </section>

      <!-- Projects -->
      <section class="section animatable" id="projects">
        <div class="section__inner">
          <h2 class="section__heading" data-i18n="projects.heading">Projects</h2>
          <div class="projects-grid" id="projects-list"></div>
        </div>
      </section>

    </main>


    <script src="app.js"></script>
  </body>
</html>
